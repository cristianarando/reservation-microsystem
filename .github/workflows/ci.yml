name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema & generate client
        run: |
          npx prisma validate
          npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint check
        run: pnpm lint

      - name: Run acceptance criteria unit tests
        run: pnpm test

      - name: Run security and utility validator tests
        run: pnpm test:security

      - name: Apply migrations, seed, and run integration suites
        env:
          DATABASE_URL: file:./ci-test.db
          SESSION_SECRET: ci-test-session-secret-at-least-32-chars
        run: |
          npx prisma migrate deploy
          pnpm db:seed
          pnpm test:audit
          pnpm test:api

      - name: Build production bundle
        env:
          DATABASE_URL: file:./ci-test.db
          SESSION_SECRET: ci-test-session-secret-at-least-32-chars
        run: pnpm build
